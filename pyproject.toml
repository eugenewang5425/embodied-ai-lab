[project]
name = "embodied-learning"
version = "0.1.0"
description = "具身智能学习与本地机器人仿真实验"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium[mujoco]>=1.2,<2",
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "scipy>=1.16,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embodied_learning"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
