[project]
name = "monocular-depth-lab"
version = "0.2.8"
description = "A reproducible Windows webcam lab for Depth Anything V2 Small."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python>=4.10,<5",
    "torch>=2.7,<3",
    "torchvision>=0.22,<1",
    "open3d>=0.19,<0.20",
    # Open3D 0.19 Windows wheel declares this, but the cross-platform lock metadata omits it.
    "ipywidgets>=8.0.4,<9; sys_platform == 'win32'",
    "timm>=1.0.29",
    "einops>=0.8.2",
    "safetensors>=0.8.0",
    "matplotlib>=3.11.1",
    "pillow-heif>=1.6.0",
    "depth-pro",
]

[project.scripts]
depth-download = "monocular_depth.download:main"
depth-env-check = "monocular_depth.env_check:main"
depth-image = "monocular_depth.image_demo:main"
depth-webcam = "monocular_depth.webcam_demo:main"
depth-calibrate = "monocular_depth.calibration:main"
depth-cloud = "monocular_depth.geometry:main"
depth-distance-calibrate = "monocular_depth.distance:main"
depth-frame-scale = "monocular_depth.scaling:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monocular_depth"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
depth-pro = { git = "https://github.com/apple/ml-depth-pro" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["third_party"]
